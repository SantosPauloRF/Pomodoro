[package]
name = "pomodoro"
version = "0.2.0"
description = "Timer Pomodoro para Windows"
authors = ["you"]
edition = "2021"

[lib]
name = "pomodoro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
